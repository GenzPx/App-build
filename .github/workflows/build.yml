name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Only the default read permission is needed. No secrets are consumed by this
# workflow, and no credentials are ever written into the APK or the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: ignore

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Decode the release keystore from a GitHub Secret. The keystore is NEVER
      # committed; it exists only for the lifetime of this job and is deleted below.
      - name: Decode release keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "keystore bytes: $(stat -c%s "$RUNNER_TEMP/release.jks")"
          echo "MC_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Secrets pasted through the web UI often pick up a trailing newline or
      # stray whitespace, which makes the keystore password silently wrong.
      # Trim them here so a copy-paste artefact cannot break signing.
      - name: Build release APK
        env:
          RAW_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RAW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RAW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export MC_KEYSTORE_PASSWORD="$(printf '%s' "$RAW_STORE_PASSWORD" | tr -d '[:space:]')"
          export MC_KEY_ALIAS="$(printf '%s' "$RAW_KEY_ALIAS" | tr -d '[:space:]')"
          export MC_KEY_PASSWORD="$(printf '%s' "$RAW_KEY_PASSWORD" | tr -d '[:space:]')"
          echo "store password length: ${#MC_KEYSTORE_PASSWORD}"
          echo "key alias: $MC_KEY_ALIAS"
          ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      # Remove the decoded keystore even if the build failed.
      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" || true

      # Membuktikan APK benar-benar tertanda tangan, bukan sekadar "build sukses".
      - name: Verify release APK signature
        if: always()
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "No release APK found"; exit 0; fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "### Release signature" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if "$BT/apksigner" verify --print-certs "$APK" 2>&1 | tee /tmp/sig.txt; then
            echo "SIGNED" >> "$GITHUB_STEP_SUMMARY"
            grep -E 'Verified using|certificate DN' /tmp/sig.txt >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "UNSIGNED - keystore secrets not configured" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Report APK sizes
        if: always()
        run: |
          echo "### Build artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| APK | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|------|" >> "$GITHUB_STEP_SUMMARY"
          for apk in $(find app/build/outputs/apk -name '*.apk' 2>/dev/null); do
            size=$(du -h "$apk" | cut -f1)
            echo "| \`$(basename "$apk")\` | $size |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore
